
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="icon" type="image/png" href="https://i.postimg.cc/PrqvJ5RX/IMG-7993.png" />
    <title>MTNEWS | The Ultimate News</title>
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://mtnews.netlify.app/">
    <meta property="og:title" content="MTNEWS | The Ultimate News">
    <meta property="og:description" content="A web application to share all news about the MTRP Server, featuring threads, images, links, and more with a stunning animated interface.">
    <meta property="og:image" content="https://i.postimg.cc/T33D5bNp/IMG-8965.jpg">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://mtnews.netlify.app/">
    <meta property="twitter:title" content="MTNEWS | The Ultimate News">
    <meta property="twitter:description" content="A web application to share all news about the MTRP Server, featuring threads, images, links, and more with a stunning animated interface.">
    <meta property="twitter:image" content="https://i.postimg.cc/T33D5bNp/IMG-8965.jpg">
    
    <!-- PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MTNEWS">
    <link rel="apple-touch-icon" href="https://i.postimg.cc/PrqvJ5RX/img-7993.png">
    <meta name="theme-color" content="#050505">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&family=Plus+Jakarta+Sans:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'sans-serif'],
              display: ['"Outfit"', 'sans-serif'],
            },
            colors: {
              brand: {
                orange: '#f97316',
                red: '#ef4444',
                dark: '#0a0a0a',
                glass: 'rgba(255, 255, 255, 0.05)',
              }
            },
            borderRadius: {
              'glass': '24px',
              'glass-sm': '16px',
            },
            animation: {
              'float': 'float 6s ease-in-out infinite',
              'glow': 'glow 4s ease-in-out infinite alternate',
              'slide-up': 'slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1)',
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-10px)' },
              },
              glow: {
                '0%': { boxShadow: '0 0 20px rgba(249, 115, 22, 0.2)' },
                '100%': { boxShadow: '0 0 40px rgba(239, 68, 68, 0.4)' },
              },
              slideUp: {
                '0%': { transform: 'translateY(20px)', opacity: 0 },
                '100%': { transform: 'translateY(0)', opacity: 1 },
              }
            }
          },
        },
      }
    </script>
    <style>
      /* Global Reset & Base */
      :root {
        --glass-border: 1px solid rgba(255, 255, 255, 0.08);
        --glass-bg: rgba(10, 10, 10, 0.6);
        --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      }

      html, body, #root {
        height: 100%;
        width: 100%;
        overflow-x: hidden;
        background-color: #050505;
        color: white;
      }

      body {
        overscroll-behavior-y: none;
        -webkit-font-smoothing: antialiased;
      }

      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 4px;
        height: 4px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.2);
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(249, 115, 22, 0.8);
      }
      
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

      /* Leaflet Customization */
      .leaflet-container {
        background: #0f172a;
        font-family: 'Plus Jakarta Sans', sans-serif;
        z-index: 10;
      }
      
      .glass-popup .leaflet-popup-content-wrapper {
        background: rgba(15, 15, 15, 0.9) !important;
        backdrop-filter: blur(20px) !important;
        border: 1px solid rgba(255, 255, 255, 0.1) !important;
        border-radius: 16px !important;
        color: white !important;
        box-shadow: 0 10px 40px rgba(0,0,0,0.5) !important;
      }
      .glass-popup .leaflet-popup-tip {
        background: rgba(15, 15, 15, 0.9) !important;
      }
      .glass-popup .leaflet-popup-content {
        color: white !important;
        font-weight: 600;
        margin: 10px 16px;
      }
      .glass-popup .leaflet-popup-close-button { display: none; }

      /* Snow Effect */
      .Snow {
          position: fixed;
          top: 0;
          left: 0;
          width: 100%;
          height: 100vh;
          pointer-events: none;
          z-index: 9998;
      }
      .Snowflake {
          position: fixed;
          top: -20px;
          color: #FFF;
          pointer-events: none;
          animation: fall linear infinite;
      }
      @keyframes fall {
          to { transform: translateY(105vh); }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.4",

    "vite": "https://esm.sh/vite@^7.3.1",
    "firebase/": "https://esm.sh/firebase@^12.9.0/",
    "framer-motion": "https://esm.sh/framer-motion@^12.34.0",
    "react-leaflet": "https://esm.sh/react-leaflet@^5.0.0",
    "leaflet": "https://esm.sh/leaflet@^1.9.4",
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
    "react-dom": "https://esm.sh/react-dom@^19.2.4"
  }
}
</script>
</head>
