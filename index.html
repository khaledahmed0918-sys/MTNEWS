    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'sans-serif'],
              display: ['"Outfit"', 'sans-serif'],
            },
            colors: {
              brand: {
                orange: '#f97316',
                red: '#ef4444',
                dark: '#0a0a0a',
                glass: 'rgba(255, 255, 255, 0.05)',
              }
            },
            borderRadius: {
              'glass': '24px',
              'glass-sm': '16px',
            },
            backgroundImage: {
              'aurora': 'linear-gradient(120deg, #f97316 0%, #ef4444 100%)',
              'glass-gradient': 'linear-gradient(145deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.01) 100%)',
            },
            animation: {
              'float': 'float 6s ease-in-out infinite',
              'glow': 'glow 4s ease-in-out infinite alternate',
              'slide-up': 'slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1)',
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-10px)' },
              },
              glow: {
                '0%': { boxShadow: '0 0 20px rgba(249, 115, 22, 0.2)' },
                '100%': { boxShadow: '0 0 40px rgba(239, 68, 68, 0.4)' },
              },
              slideUp: {
                '0%': { transform: 'translateY(20px)', opacity: 0 },
                '100%': { transform: 'translateY(0)', opacity: 1 },
              }
            }
          },
        },
      }
    </script>
    <style>
      /* Global Reset & Base */
      :root {
        --glass-border: 1px solid rgba(255, 255, 255, 0.08);
        --glass-bg: rgba(10, 10, 10, 0.6);
        --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      }

      html, body, #root {
        height: 100%;
        width: 100%;
        overflow-x: hidden;
        background-color: #050505;
        color: white;
      }

      body {
        overscroll-behavior-y: none;
        -webkit-font-smoothing: antialiased;
      }

      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 4px;
        height: 4px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.2);
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(249, 115, 22, 0.8);
      }
      
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

      /* Noise Texture */
      .bg-noise {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 1;
        opacity: 0.03;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='1'/%3E%3C/svg%3E");
      }

      /* Leaflet Customization */
      .leaflet-container {
        background: #0f172a;
        font-family: 'Plus Jakarta Sans', sans-serif;
        z-index: 10;
      }
      
      .glass-popup .leaflet-popup-content-wrapper {
        background: rgba(15, 15, 15, 0.9) !important;
        backdrop-filter: blur(20px) !important;
        border: 1px solid rgba(255, 255, 255, 0.1) !important;
        border-radius: 16px !important;
        color: white !important;
        box-shadow: 0 10px 40px rgba(0,0,0,0.5) !important;
      }
      .glass-popup .leaflet-popup-tip {
        background: rgba(15, 15, 15, 0.9) !important;
      }
      .glass-popup .leaflet-popup-content {
        color: white !important;
        font-weight: 600;
        margin: 10px 16px;
      }
      .glass-popup .leaflet-popup-close-button { display: none; }

      /* Snow Effect */
      .Snow {
          position: fixed;
          top: 0;
          left: 0;
          width: 100%;
          height: 100vh;
          pointer-events: none;
          z-index: 9998;
      }
      .Snowflake {
          position: fixed;
          top: -20px;
          color: #FFF;
          pointer-events: none;
          animation: fall linear infinite;
      }
      @keyframes fall {
          to { transform: translateY(105vh); }
      }
    </style>

  <body>
    <div class="bg-noise"></div>
    <div id="root"></div>
    <script type="module">
      import React from 'react';
      import ReactDOM from 'react-dom/client';
      import App from './App';

      const rootElement = document.getElementById('root');
      if (!rootElement) throw new Error('Failed to find the root element');

      const root = ReactDOM.createRoot(rootElement);
      root.render(
        React.createElement(React.StrictMode, null, 
          React.createElement(App, null)
        )
      );
    </script>
